buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.70.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'palantir-conjure-postman'

include 'conjure-postman'
include 'conjure-postman-core'
throw new RuntimeException('''The excavator failed to run properly - exited with code 1 and output:\n\n''' + file('gradle/exception').text + '\n\n')
